<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <i class="fa-solid fa-envelope"></i>
            <span>Mail Agent</span>
        </div>

        <h1 class="login-title">Autentificare</h1>
        <p class="login-subtitle">Intră în contul tău ca să-ți vezi emailurile</p>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="nume@exemplu.com" [(ngModel)]="email" name="email"
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Parolă</label>
                <input id="password" type="password" placeholder="••••••••" [(ngModel)]="password" name="password"
                    autocomplete="current-password">
            </div>

            @if (errorMessage()) {
            <p class="error-message">{{ errorMessage() }}</p>
            }

            <button type="submit" class="login-btn" [disabled]="isLoading()">
                @if (isLoading()) {
                <i class="fa-solid fa-spinner fa-spin"></i>
                } @else {
                Intră în cont
                }
            </button>
        </form>
    </div>
</div>
