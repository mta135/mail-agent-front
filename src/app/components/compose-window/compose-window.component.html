@if (composeService.isOpen()) {
<div class="compose-window">
    <div class="compose-header">
        <span>Mesaj nou</span>
        <button class="close-btn" (click)="composeService.close()">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="compose-body">
        <div class="recipients-field">
            @for (recipient of recipients(); track recipient; let i = $index) {
            <span class="recipient-chip">
                {{ recipient }}
                <button class="chip-remove" (click)="removeRecipient(i)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </span>
            }
            <input type="text" class="recipient-input" placeholder="{{ recipients().length === 0 ? 'Către' : '' }}"
                [(ngModel)]="currentRecipientInput" (keydown)="onRecipientKeydown($event)" (blur)="addRecipient()">
        </div>
        <input type="text" placeholder="Subiect" class="compose-field">
        <textarea placeholder="Scrie mesajul aici..." class="compose-textarea"></textarea>

        @if (attachments().length > 0) {
        <div class="attachment-list">
            @for (file of attachments(); track file.name; let i = $index) {
            <div class="attachment-chip">
                <i class="fa-solid fa-paperclip"></i>
                <span class="attachment-name">{{ file.name }}</span>
                <span class="attachment-size">{{ formatFileSize(file.size) }}</span>
                <button class="attachment-remove" (click)="removeAttachment(i)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            }
        </div>
        }
    </div>

    <div class="compose-footer">
        <button class="send-btn">
            <i class="fa-solid fa-paper-plane"></i>
            Trimite
        </button>

        <label class="attach-btn">
            <i class="fa-solid fa-paperclip"></i>
            <input type="file" multiple hidden (change)="onFileSelected($event)">
        </label>
    </div>
</div>
}
